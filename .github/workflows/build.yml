name: Build static xbps

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      xbps_version:
        description: 'xbps version (e.g. 0.60.7)'
        required: true
        default: '0.60.7'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7l
            platform: linux/arm/v7
          - arch: armv6l
            platform: linux/arm/v6
          - arch: i686
            platform: linux/386
          - arch: ppc64le
            platform: linux/ppc64le
          - arch: riscv64
            platform: linux/riscv64
          - arch: s390x
            platform: linux/s390x

    name: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Resolve xbps version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.xbps_version }}" ]; then
            v="${{ github.event.inputs.xbps_version }}"
          else
            v="${GITHUB_REF_NAME}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - name: Prepare dist dir
        run: |
          mkdir -p dist
          chmod 777 dist

      - name: Build inside Alpine (${{ matrix.platform }})
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -v "$PWD:/work" -w /work \
            -e XBPS_VERSION="${{ steps.ver.outputs.version }}" \
            alpine:latest \
            sh /work/build.sh

      - name: Fix artifact ownership
        run: sudo chown -R "$USER:$USER" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xbps-${{ steps.ver.outputs.version }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        run: |
          cd dist
          # Drop the per-arch .sha256 files, regenerate one combined SHA256SUMS
          rm -f *.sha256
          sha256sum *.tar.gz | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
