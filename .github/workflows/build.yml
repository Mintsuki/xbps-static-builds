name: Build static xbps

on:
  push:
    branches:
      - 'trunk'
  workflow_dispatch:

jobs:
  prepare:
    name: Compute release tag
    runs-on: ubuntu-latest
    outputs:
      tag_date: ${{ steps.set.outputs.tag_date }}
    steps:
      - name: Compute timestamp
        id: set
        run: echo "tag_date=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7l
            platform: linux/arm/v7
          - arch: armv6l
            platform: linux/arm/v6
          - arch: i686
            platform: linux/386
          - arch: ppc64le
            platform: linux/ppc64le
          - arch: riscv64
            platform: linux/riscv64
          - arch: s390x
            platform: linux/s390x

    name: Build xbps for ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Prepare dist dir
        run: |
          mkdir -p dist
          chmod 777 dist

      - name: Build inside Alpine (${{ matrix.platform }})
        run: |
          docker run --rm --platform=${{ matrix.platform }} \
            -v "$PWD:/work" -w /work \
            -e ARCH="${{ matrix.arch }}" \
            alpine:latest \
            sh /work/build.sh

      - name: Fix artifact ownership
        run: sudo chown -R "$USER:$USER" dist/

      - name: Upload xbps artifact
        uses: actions/upload-artifact@v7
        with:
          name: xbps-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all xbps artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: xbps-*
          merge-multiple: true

      - name: Read xbps version
        run: grep -o 'XBPS_VERSION=.*$' build.sh >> $GITHUB_ENV

      - name: Tag new release
        run: |
          git tag ${{ needs.prepare.outputs.tag_date }}
          git push --tags

      - name: Create new release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.prepare.outputs.tag_date }}
          tag_name: ${{ needs.prepare.outputs.tag_date }}
          body: |
            Static musl-linked builds of xbps.

            This build is based on:
              - xbps ${{ env.XBPS_VERSION }}
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
